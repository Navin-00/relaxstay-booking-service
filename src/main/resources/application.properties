spring.application.name=booking-service
server.port=8082
spring.profile= local

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/booking_service
spring.datasource.username=root
spring.datasource.password=Navin@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect (Optional for newer Spring Boot versions)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

kafka.bootstrap-server=localhost:9092
auto.create.topics.enable=true

# Producer
kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producer.value-serializer=com.relaxstay.booking_service.kafka.HotelRequestSerializer

# Kafka topic
kafka.topic.hotel=booking-topic

user-service-url=http://localhost:8080
hotel-service-url=http://localhost:8081